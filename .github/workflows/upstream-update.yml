name: Prepare upstream update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-update
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'natsufatsu/zia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Configure candidate commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Prepare and check candidate
        id: candidate
        env:
          REPORT: ${{ runner.temp }}/zia-update.json
          WORKTREE: ${{ runner.temp }}/zia-candidate
        run: |
          set +e
          python scripts/update_upstream.py --worktree "$WORKTREE" --report "$REPORT"
          result=$?
          set -e
          if [ ! -f "$REPORT" ]; then exit "$result"; fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ['REPORT']).read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('status=' + result['status'] + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
          if [ "$result" -ne 0 ]; then exit "$result"; fi
      - name: Open draft update PR
        if: steps.candidate.outputs.status == 'prepared'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/zia-update.json
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          result = json.loads(Path(os.environ['REPORT']).read_text())
          branch = result['branch']
          existing = subprocess.check_output(['gh', 'pr', 'list', '--head', branch, '--state', 'open', '--json', 'number'], text=True)
          if json.loads(existing):
              print('An update PR is already open for this upstream commit.')
              raise SystemExit(0)
          remote = subprocess.check_output(['git', 'ls-remote', '--heads', 'origin', branch], text=True)
          if remote.strip():
              raise SystemExit('Update branch already exists remotely; review it without overwriting it.')
          subprocess.run(['git', '-C', result['worktree'], 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True)
          body = Path(os.environ['REPORT']).with_suffix('.md')
          body.write_text('Imports upstream ' + result['upstream'] + ' as fork ' + result['version'] + '.\n\n'
              'Generated-file, syntax, behavior and preservation checks passed. The custom sidebar/player and excluded features remain protected.\n\n'
              '**Before merging:** run `python scripts/check.py --live --zen PATH` on this branch in an isolated Zen profile and review the upstream changes. GitHub did not run Zen visual checks.\n', encoding='utf-8')
          subprocess.run(['gh', 'pr', 'create', '--draft', '--base', 'main', '--head', branch,
              '--title', 'Import upstream update as ' + result['version'], '--body-file', str(body)], check=True)
          PY
      - name: Save update report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-update-report
          path: ${{ runner.temp }}/zia-update.json
          if-no-files-found: ignore
